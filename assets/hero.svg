    <text x="58" y="220" font-size="19" fill="#bfcee0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">FULL-STACK DEVELOPMENT</text>
    <text x="58" y="249" font-size="17" fill="#88a6bf" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">Automation  /  Python  /  Cloud &amp; DevOps</text>
    <rect x="790" y="56" width="362" height="207" rx="14" fill="#0c1425" stroke="#405070" stroke-opacity="0.85"/>
