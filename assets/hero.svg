    <circle cx="829" cy="73" r="5" fill="#fbbf24"/>
    <circle cx="848" cy="73" r="5" fill="#34d399"/>
    <text x="813" y="121" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="13">01</text>
    <text x="846" y="121" fill="#c4b5fd" font-family="Menlo,Consolas,monospace" font-size="13">const</text>
    <text x="894" y="121" fill="#dbeafe" font-family="Menlo,Consolas,monospace" font-size="13">focus =</text>
    <text x="966" y="121" fill="#7dd3fc" font-family="Menlo,Consolas,monospace" font-size="13">"build";</text>
    <text x="813" y="154" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="13">02</text>
    <text x="846" y="154" fill="#86efac" font-family="Menlo,Consolas,monospace" font-size="13">automate</text>
    <text x="914" y="154" fill="#dbeafe" font-family="Menlo,Consolas,monospace" font-size="13">(theBoringStuff);</text>
    <text x="813" y="187" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="13">03</text>
    <text x="846" y="187" fill="#86efac" font-family="Menlo,Consolas,monospace" font-size="13">keepLearning</text>
    <text x="951" y="187" fill="#dbeafe" font-family="Menlo,Consolas,monospace" font-size="13">();</text>
    <text x="813" y="220" fill="#64748b" font-family="Menlo,Consolas,monospace" font-size="13">04</text>
    <text x="846" y="220" fill="#94a3b8" font-family="Menlo,Consolas,monospace" font-size="13">// make it useful</text>
