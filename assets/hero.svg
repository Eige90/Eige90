<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Eigner — Full-Stack Developer</title>
  <desc id="desc">Dark blue developer banner with a code editor illustration and a gradient accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.56" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1a1740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-width="0.7" opacity="0.19"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="310" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
