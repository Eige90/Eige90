<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#58647f" stroke-width=".6" opacity=".24" fill="none"/></pattern>
<clipPath id="frame"><rect width="1200" height="220" rx="22"/></clipPath>
</defs>
<g clip-path="url(#frame)">
